name: Build & Test (Windows)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test:
    runs-on: windows-2019

    env:
      LLVM_ARCHIVE: llvm-11.0.0-x86_64-windows-msvc-release-mt

    steps:
      - uses: actions/checkout@v2

      - name: Setup LLVM
        run: |
          C:\msys64\usr\bin\wget.exe -q "https://github.com/google/lldb-eval/releases/download/llvm-11/$env:LLVM_ARCHIVE.7z"
          7z x -y "$env:LLVM_ARCHIVE.7z"
          echo "LLVM_INSTALL_PATH=$pwd/$env:LLVM_ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build
        run: bazel build :all

      - name: Poor man's test 1
        run: bazel test -s :parser_test
        
      - name: Poor man's test 2
        run: bazel run :eval_test

      - name: Test
        run: bazel test --test_output=errors :all

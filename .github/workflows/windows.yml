name: Build & Test (Windows)

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-test:
    runs-on: windows-2019

    steps:
      - uses: actions/checkout@v2

      - name: Setup LLVM
        run: |
          $env:LLVM_ARCHIVE = "llvm-11.0.0-x86_64-windows-msvc-release-mt"
          C:\msys64\usr\bin\wget.exe -q "https://github.com/google/lldb-eval/releases/download/llvm-11/$env:LLVM_ARCHIVE.7z"
          7z x -y "$env:LLVM_ARCHIVE.7z"
          echo "LLVM_INSTALL_PATH=$pwd/$env:LLVM_ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build
        run: bazel build :all

      - run: bazel build tools:lexer
      - run: .\bazel-bin\tools\lexer.exe "1+1"
      - run: bazel run :main -- "1+1"
      - run: .\bazel-bin\parser_test.exe
      - run: bazel test -s :parser_test
      - run: bazel run :eval_test

      - name: Test
        run: bazel test --test_output=errors :all

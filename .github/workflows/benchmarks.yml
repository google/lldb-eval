name: Benchmarks

on:
  pull_request:

jobs:
  benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Who triggered this?
        run: |
          echo "Action triggered by ${{ github.event.pull_request.html_url }}"

      - name: Setup LLVM (Linux)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 11
          sudo apt install -y llvm-11-dev libclang-11-dev liblldb-11-dev
          echo "LLVM_INSTALL_PATH=/usr/lib/llvm-11" >> $GITHUB_ENV
          echo "CC=gcc-10" >> $GITHUB_ENV
          echo "CXX=g++-10" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 50 # this is to make sure we obtain the target base commit
          path: lldb-eval

      - name: Setup benchmarks
        run: |
          echo "BASELINE_JSON=`${mktemp}`" >> $GITHUB_ENV
          echo "CONTENDER_JSON=`${mktemp}`" >> $GITHUB_ENV

      - name: Run benchmarks
        working-directory: ./lldb-eval
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          bazel run -c opt lldb-eval:eval_benchmark -- --benchmark_format=json > ${{ env.BASELINE_JSON }}

          git checkout ${{ github.event.pull_request.head.sha }}
          bazel run -c opt lldb-eval:eval_benchmark -- --benchmark_format=json > ${{ env.CONTENDER_JSON }}

      - name: Compare results
        run: |
          git clone https://github.com/google/benchmark google_benchmark
          cd google_benchmark

          bazel run //tools:compare -- benchmarks ${{ env.BASELINE_JSON }} ${{ env.CONTENDER_JSON }}
